name: APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proje klasörünü bul
        run: |
          if [ -f nefes-app.zip ]; then
            echo "nefes-app.zip bulundu, açılıyor."
            rm -rf _zip && mkdir _zip && unzip -q nefes-app.zip -d _zip
            DIR=$(dirname "$(find _zip -name capacitor.config.json -not -path '*/node_modules/*' -not -path '*/android/*' | head -n 1)")
          else
            DIR=$(dirname "$(find . -name capacitor.config.json -not -path '*/node_modules/*' -not -path '*/android/*' | head -n 1)")
          fi
          if [ -z "$DIR" ] || [ ! -f "$DIR/package.json" ]; then
            echo "Proje bulunamadı."; exit 1
          fi
          echo "Proje klasörü: $DIR"
          echo "APP_DIR=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paketleri yükle
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Web dosyalarını Android projesine kopyala
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: APK derle
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nefes-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
